name: rater

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rater
      POSTGRES_PASSWORD: rater
      POSTGRES_DB: rater
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rater"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://rater:rater@postgres:5432/rater
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      # Falls back to the dev default (not empty) so an unset var can't blank the secret.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-in-production}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # keep the image's node_modules, not the host's
    depends_on:
      - api

volumes:
  pgdata:
